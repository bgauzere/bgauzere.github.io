{{ define "main" }}
<main class="container">
  <header>
    <h1>{{ .Title }}</h1>
    {{ with .Content }}
      <div>{{ . }}</div>
    {{ end }}
  </header>
  <ul>
    {{ range .Pages.ByDate.Reverse }}
      <li>
        <a href="{{ .RelPermalink }}">
          {{ .Date.Format "2006-01-02" }} | {{ .LinkTitle }}
        </a>
        {{ with .Description }}
          <p>{{ . }}</p>
        {{ end }}
      </li>
    {{ end }}
  </ul>
</main>
{{ end }}
